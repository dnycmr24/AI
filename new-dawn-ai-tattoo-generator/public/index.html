<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEW DAWN AI Tattoo Generator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#1b1b1b,#000 55%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.app{
  max-width:560px;
  margin:0 auto;
  padding:22px;
}
.header{
  text-align:center;
  padding:24px 0 18px;
}
.logo{
  letter-spacing:10px;
  color:#777;
  font-size:14px;
  margin-bottom:18px;
}
h1{
  margin:0;
  font-size:34px;
  line-height:1.05;
  font-weight:900;
}
.sub{
  margin-top:12px;
  color:#888;
  letter-spacing:4px;
  font-size:12px;
}
.card{
  background:linear-gradient(180deg,#121212,#050505);
  border:1px solid #333;
  border-radius:24px;
  padding:20px;
  margin:16px 0;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
label{
  display:block;
  margin:14px 0 7px;
  color:#888;
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
}
textarea,select,input{
  width:100%;
  background:#000;
  border:1px solid #3a3a3a;
  color:#fff;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  outline:none;
}
textarea{min-height:125px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,a.btn{
  width:100%;
  margin-top:14px;
  padding:16px;
  border-radius:14px;
  border:none;
  background:#fff;
  color:#000;
  font-weight:900;
  font-size:15px;
  letter-spacing:1px;
  cursor:pointer;
  text-decoration:none;
  display:block;
  text-align:center;
}
button.dark{background:#191919;color:#fff;border:1px solid #333}
button:disabled{opacity:.5;cursor:not-allowed}
.result{
  background:#000;
  border:1px solid #333;
  border-radius:24px;
  min-height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  position:relative;
}
.result img{
  width:100%;
  height:auto;
  display:block;
}
.loading{
  padding:30px;
  color:#aaa;
  line-height:1.6;
}
.error{
  color:#ff7777;
  padding:20px;
  line-height:1.5;
}
.prompt{
  background:#000;
  border:1px solid #333;
  border-radius:18px;
  padding:14px;
  color:#aaa;
  font-size:12px;
  line-height:1.45;
  white-space:pre-wrap;
}
.footer{
  text-align:center;
  color:#555;
  font-size:10px;
  letter-spacing:5px;
  padding:30px 0;
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">ND//24</div>
    <h1>AI TATTOO<br>GENERATOR</h1>
    <div class="sub">BENEATH THE SURFACE</div>
  </div>

  <div class="card">
    <label>Motiv / Idee</label>
    <textarea id="idea">realistic skull, smoke, broken smiley, hidden meaning</textarea>

    <div class="grid">
      <div>
        <label>Style</label>
        <select id="style">
          <option>BLACK & GREY REALISM</option>
          <option>XR SERIES</option>
          <option>BENEATH THE SURFACE</option>
          <option>DARK SURREAL</option>
          <option>GOTHIC LETTERING</option>
          <option>BIKER ROAD SYMBOLISM</option>
        </select>
      </div>
      <div>
        <label>Körperstelle</label>
        <select id="placement">
          <option>forearm</option>
          <option>upper arm</option>
          <option>chest</option>
          <option>back</option>
          <option>leg</option>
          <option>hand</option>
          <option>neck</option>
        </select>
      </div>
    </div>

    <label>Mood</label>
    <input id="mood" value="dark, raw, cinematic, meaningful"/>

    <button id="generateBtn" onclick="generateImage()">ECHTES MOTIV ERSTELLEN</button>
    <button class="dark" onclick="randomIdea()">RANDOM IDEA</button>
    <button class="dark" onclick="downloadImage()">BILD DOWNLOAD</button>
  </div>

  <div class="result" id="result">
    <div class="loading">
      Dein echtes KI-Tattoo-Motiv erscheint hier.<br><br>
      Erst OPENAI_API_KEY in Vercel setzen.
    </div>
  </div>

  <div class="card">
    <label>Generierter Prompt</label>
    <div class="prompt" id="promptBox">Noch kein Prompt generiert.</div>
  </div>

  <div class="footer">AUTHENTICITY OVER IMAGE</div>
</div>

<script>
let currentImage = "";

const ideas = [
  "realistic skull, smoke, broken smiley, hidden meaning",
  "open book, cross, clouds, grief and memory",
  "raven, candle, hidden skull, dark symbolism",
  "xray skull, bones, smoke, negative space",
  "road line breaking into freedom symbol",
  "angel statue with cracked face and smoke",
  "motorcycle helmet, storm, anti image concept",
  "gothic lettering saying TRUST FEW with subtle abstract marks"
];

function randomIdea(){
  document.getElementById("idea").value = ideas[Math.floor(Math.random()*ideas.length)];
}

async function generateImage(){
  const btn = document.getElementById("generateBtn");
  const result = document.getElementById("result");
  const promptBox = document.getElementById("promptBox");

  btn.disabled = true;
  btn.innerText = "GENERATING...";
  result.innerHTML = '<div class="loading">KI erstellt dein Tattoo-Motiv...<br>Das kann 20–60 Sekunden dauern.</div>';

  try{
    const response = await fetch("/api/generate", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        idea: document.getElementById("idea").value,
        style: document.getElementById("style").value,
        placement: document.getElementById("placement").value,
        mood: document.getElementById("mood").value
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Fehler beim Generieren.");
    }

    currentImage = data.image;
    result.innerHTML = '<img src="'+data.image+'" alt="Generated tattoo motive"/>';
    promptBox.innerText = data.prompt || "";
  }catch(err){
    result.innerHTML = '<div class="error">'+err.message+'</div>';
  }finally{
    btn.disabled = false;
    btn.innerText = "ECHTES MOTIV ERSTELLEN";
  }
}

function downloadImage(){
  if(!currentImage){
    alert("Bitte erst ein Motiv erstellen.");
    return;
  }
  const a = document.createElement("a");
  a.href = currentImage;
  a.download = "new-dawn-ai-tattoo-motive.png";
  a.click();
}
</script>
</body>
</html>
